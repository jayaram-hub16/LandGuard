################################################################################
# render.yaml — LandGuard GIS Encroachment Detection Application
# Render Blueprint: https://render.com/docs/blueprint-spec
#
# USAGE:
#   1. Push this file to GitHub (already in repo root).
#   2. In Render dashboard → New → Blueprint → connect your GitHub repo.
#   3. Render reads this file, provisions the web service + PostgreSQL DB.
#   4. After first deploy, run via Render Shell:
#        flask create-admin
################################################################################

services:
  - type: web
    name: landguard
    runtime: python
    region: singapore
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn run:app --workers 2 --worker-class gthread --threads 4 --bind 0.0.0.0:$PORT --timeout 120 --log-level info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: landguard-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false          # Set in Render dashboard: your Vercel URL or custom domain
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
    healthCheckPath: /api/health

databases:
  - name: landguard-db
    plan: free
    region: singapore
