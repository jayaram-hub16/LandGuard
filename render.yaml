################################################################################
# render.yaml — LandGuard GIS Encroachment Detection Application
# Render Blueprint: https://render.com/docs/blueprint-spec
#
# USAGE:
#   1. Push this file to GitHub (already in repo root).
#   2. In Render dashboard → New → Blueprint → connect your GitHub repo.
#   3. Render reads this file, provisions the web service + PostgreSQL DB.
#   4. After first deploy, run via Render Shell:
#        flask create-admin
################################################################################

services:
  - type: web
    name: landguard
    runtime: python
    region: singapore
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn run:app --workers 2 --worker-class gthread --threads 4 --bind 0.0.0.0:$PORT --timeout 120 --log-level info"
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: landguard-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://landguard.vercel.app
      - key: CORS_ORIGINS
        value: https://landguard.vercel.app,http://localhost:5173
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # ── Email / SMTP for OTP password recovery ──────────────────────────
      # Set these in Render dashboard → Environment → Add Secret
      # For Gmail: generate an App Password (not your login password)
      # Google Account → Security → 2-Step Verification → App Passwords
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: LandGuard
      - key: MAIL_USE_TLS
        value: "true"
      # Legacy aliases (keep for backward compat)
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
    healthCheckPath: /api/health

databases:
  - name: landguard-db
    plan: free
    region: singapore
